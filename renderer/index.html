<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocForge</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="macos">

<div id="app">

<!-- ═══════════════ Sidebar (macOS translucent) ═══════════════ -->
<aside id="sidebar">
  <div class="sidebar-header">
    <span class="app-title">DocForge</span>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-item active" data-tab="converter">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <polyline points="3 8 1 8 1 3 6 3"/><path d="M1 8 L15 15"/><path d="M15 15 L15 1"/><path d="M1 1 L8 8"/>
      </svg>
      <span>格式转换</span>
    </button>
    <button class="nav-item" data-tab="pdf-ops">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M3 1h6l4 4v10H3V1z"/><path d="M9 1v4h4"/>
      </svg>
      <span>PDF 拆分合并</span>
    </button>
    <button class="nav-item" data-tab="pdf-editor">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M11.5 1.5a1.5 1.5 0 0 1 2 2L8 11l-3 1 1-3 5.5-7.5z"/><path d="M10 2l3 3"/>
      </svg>
      <span>可编辑 PDF</span>
    </button>
  </nav>
</aside>

<!-- ═══════════════ Main Content ═══════════════ -->
<main id="main">

  <!-- ── Tab: 格式转换 ── -->
  <section id="panel-converter" class="panel active">
    <div class="panel-toolbar">
      <h2>格式转换</h2>
      <p class="toolbar-desc">拖拽文件到下方区域，选择目标格式，一键批量转换</p>
    </div>

    <div class="panel-body">
      <!-- Drop Zone -->
      <div id="drop-zone" class="drop-zone">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="drop-label">拖拽文件到此处，或<span id="btn-browse" class="link">选择文件</span></p>
        <p class="drop-hint">支持 PDF · DOCX · XLSX · PPTX · PNG · JPG · TXT · DXF</p>
      </div>

      <!-- File List -->
      <div id="file-list" class="file-list"></div>

      <!-- Convert Bar -->
      <div id="convert-bar" class="action-bar hidden">
        <span id="file-count">0 个文件</span>
        <span class="sep">→</span>
        <select id="target-format" class="native-select">
          <option value="pdf">PDF</option>
          <option value="docx">Word (DOCX)</option>
          <option value="xlsx">Excel (XLSX)</option>
          <option value="pptx">PowerPoint (PPTX)</option>
          <option value="txt">纯文本 (TXT)</option>
          <option value="png">PNG 图片</option>
          <option value="jpg">JPG 图片</option>
          <option value="dxf">CAD (DXF)</option>
        </select>
        <button id="btn-convert" class="btn-primary">开始转换</button>
      </div>

      <!-- Progress -->
      <div id="progress-area" class="progress-area hidden">
        <div class="progress-track">
          <div id="progress-bar" class="progress-fill"></div>
        </div>
        <span id="progress-text">0%</span>
      </div>

      <!-- Results -->
      <div id="results-area" class="results-area hidden">
        <div class="results-head">
          <h3>转换完成</h3>
          <button id="btn-download-all" class="btn-secondary">下载全部 (ZIP)</button>
        </div>
        <div id="results-list" class="results-grid"></div>
      </div>
    </div>
  </section>

  <!-- ── Tab: PDF 拆分合并 ── -->
  <section id="panel-pdf-ops" class="panel">
    <div class="panel-toolbar">
      <h2>PDF 拆分 & 合并</h2>
      <div class="segmented-control">
        <button class="segment active" data-op="split">拆分</button>
        <button class="segment" data-op="merge">合并</button>
        <button class="segment" data-op="pages">页面操作</button>
      </div>
    </div>

    <div class="panel-body">
      <!-- Split -->
      <div id="op-split" class="op-panel active">
        <div class="drop-zone small" id="drop-split">
          <p>拖拽 PDF 到此处或<span class="link" id="btn-split-browse">选择文件</span></p>
        </div>
        <div id="split-file-info" class="file-info hidden">
          <span class="file-icon">📄</span>
          <span id="split-filename"></span>
          <span id="split-page-count" class="meta"></span>
        </div>
        <div class="field">
          <label>页面范围（如 1-3,5,7-9，留空每页单独拆分）</label>
          <input type="text" id="split-ranges" class="native-input" placeholder="1-3,5,7-9">
        </div>
        <button id="btn-split" class="btn-primary hidden">执行拆分</button>
        <div id="split-results" class="results-grid"></div>
      </div>

      <!-- Merge -->
      <div id="op-merge" class="op-panel">
        <div class="drop-zone small" id="drop-merge">
          <p>拖拽多个 PDF 到此处或<span class="link" id="btn-merge-browse">选择文件</span></p>
        </div>
        <div id="merge-file-list" class="merge-list"></div>
        <button id="btn-merge" class="btn-primary hidden">合并 PDF</button>
        <div id="merge-results" class="results-grid"></div>
      </div>

      <!-- Page Operations -->
      <div id="op-pages" class="op-panel">
        <div class="drop-zone small" id="drop-pages">
          <p>拖拽 PDF 到此处或<span class="link" id="btn-pages-browse">选择文件</span></p>
        </div>
        <div id="pages-preview" class="pages-grid hidden"></div>
        <div id="pages-actions" class="action-row" style="display:none">
          <button id="btn-rotate-sel" class="btn-secondary">↻ 旋转 90°</button>
          <button id="btn-delete-sel" class="btn-danger">删除选中</button>
          <button id="btn-apply-pages" class="btn-primary">应用更改</button>
        </div>
        <div id="pages-results" class="results-grid"></div>
      </div>
    </div>
  </section>

  <!-- ── Tab: 可编辑 PDF ── -->
  <section id="panel-pdf-editor" class="panel">
    <div class="panel-toolbar editor-toolbar-top">
      <h2>可编辑 PDF</h2>
      <div class="toolbar-actions hidden" id="editor-toolbar">
        <div class="segmented-control">
          <button class="segment active" data-tool="select">选择</button>
          <button class="segment" data-tool="text">文字</button>
          <button class="segment" data-tool="rect">矩形</button>
          <button class="segment" data-tool="eraser">擦除</button>
        </div>
        <input type="color" id="editor-color" class="color-pick" value="#000000" title="文字/边框颜色">
        <input type="color" id="editor-fill" class="color-pick" value="#ffffff" title="填充颜色">
        <span class="toolbar-spacer"></span>
        <span id="editor-page-info" class="meta">—</span>
        <span class="toolbar-spacer"></span>
        <button id="btn-editor-save" class="btn-primary small">保存</button>
      </div>
    </div>

    <div class="editor-body">
      <!-- Page thumbnails sidebar -->
      <div class="editor-thumbs">
        <div class="drop-zone tiny" id="drop-editor">
          <p>拖入 PDF</p>
        </div>
        <div id="editor-pages" class="thumb-list"></div>
      </div>

      <!-- Canvas -->
      <div class="editor-canvas-area">
        <div id="editor-canvas-container" class="canvas-scroll">
          <canvas id="editor-canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Text edit popover -->
    <div id="text-edit-popup" class="popover hidden">
      <textarea id="text-edit-input" rows="3" placeholder="输入文本…"></textarea>
      <div class="popover-row">
        <label>颜色</label>
        <input type="color" id="text-edit-color" class="color-pick" value="#000000">
      </div>
      <div class="popover-btns">
        <button id="btn-text-save" class="btn-primary small">确定</button>
        <button id="btn-text-cancel" class="btn-secondary small">取消</button>
      </div>
    </div>

    <!-- Rect properties popover -->
    <div id="rect-props-popup" class="popover hidden">
      <div class="popover-row">
        <label>边框色</label>
        <input type="color" id="rect-border-color" class="color-pick" value="#ff3b30">
      </div>
      <div class="popover-row">
        <label>填充色</label>
        <input type="color" id="rect-fill-color" class="color-pick" value="#ffffff">
      </div>
      <div class="popover-btns">
        <button id="btn-rect-delete" class="btn-danger small">删除</button>
        <button id="btn-rect-apply" class="btn-primary small">应用</button>
      </div>
    </div>
  </section>

</main>
</div>

<!-- Hidden inputs -->
<input type="file" id="file-input" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.bmp,.tiff,.txt,.csv,.dxf,.dwg">
<input type="file" id="file-input-pdf" hidden accept=".pdf">

<script src="js/app.js"></script>
<script src="js/converter.js"></script>
<script src="js/pdf-split.js"></script>
<script src="js/pdf-editor.js"></script>
</body>
</html>
